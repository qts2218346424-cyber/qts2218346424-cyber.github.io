<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Aether Quant Studio · 苍穹量枢">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="18%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="84%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="alphaCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="quantGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas & Ambient Optical Glows -->
  <rect width="1280" height="360" rx="20" fill="url(#bgGrad)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowCyan)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowPurple)"/>
  <rect width="1280" height="360" rx="20" fill="url(#quantGrid)"/>

  <!-- Background Quantitative Equity & Candlestick Telemetry Art -->
  <path d="M 0 295 Q 160 288, 280 262 T 540 238 T 790 198 T 1040 152 T 1280 108 L 1280 360 L 0 360 Z" fill="url(#areaFill)"/>
  <path d="M 0 295 Q 160 288, 280 262 T 540 238 T 790 198 T 1040 152 T 1280 108" fill="none" stroke="url(#alphaCurve)" stroke-width="2.5"/>

  <!-- Subtle Right-Side Micro Candlesticks -->
  <g opacity="0.28">
    <line x1="940" y1="148" x2="940" y2="196" stroke="#10B981" stroke-width="1.5"/>
    <rect x="935" y="158" width="10" height="24" rx="2" fill="#10B981"/>
    <line x1="968" y1="140" x2="968" y2="184" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="963" y="150" width="10" height="18" rx="2" fill="#F43F5E"/>
    <line x1="996" y1="122" x2="996" y2="172" stroke="#10B981" stroke-width="1.5"/>
    <rect x="991" y="132" width="10" height="28" rx="2" fill="#10B981"/>
    <line x1="1024" y1="112" x2="1024" y2="155" stroke="#10B981" stroke-width="1.5"/>
    <rect x="1019" y="120" width="10" height="22" rx="2" fill="#10B981"/>
    <line x1="1052" y1="118" x2="1052" y2="160" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="1047" y="126" width="10" height="16" rx="2" fill="#F43F5E"/>
    <line x1="1080" y1="92" x2="1080" y2="144" stroke="#10B981" stroke-width="1.5"/>
    <rect x="1075" y="102" width="10" height="30" rx="2" fill="#10B981"/>
    <line x1="1108" y1="78" x2="1108" y2="126" stroke="#10B981" stroke-width="1.5"/>
    <rect x="1103" y="88" width="10" height="26" rx="2" fill="#10B981"/>
  </g>

  <!-- Outer Precision Frame -->
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Quantum Diamond Emblem -->
  <g transform="translate(76, 68)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#emblemGrad)" opacity="0.95"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <polygon points="32,12 52,32 32,52 12,32" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="5.5" fill="#FFFFFF"/>
  </g>

  <!-- Top Eyebrow Tag -->
  <g transform="translate(160, 72)">
    <rect x="0" y="0" width="286" height="24" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1"/>
    <circle cx="15" cy="12" r="4" fill="#10B981"/>
    <text x="27" y="16" fill="#BAE6FD" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="600" letter-spacing="0.8">PERSONAL QUANT SANDBOX · v2.0</text>
  </g>

  <!-- Main Title -->
  <text x="160" y="134" fill="url(#titleGrad)" font-family="'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800" letter-spacing="1.5">AETHER QUANT STUDIO</text>
  <text x="710" y="132" fill="#94A3B8" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" letter-spacing="4">· 苍穹量枢</text>

  <!-- Subtitle Description -->
  <text x="76" y="188" fill="#CBD5E1" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="18" font-weight="500">面向币安永续合约的多策略智能量化交易终端、System-One 直觉风控门禁与策略自进化实验室</text>
  <text x="76" y="218" fill="#64748B" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace" font-size="13">Five-Tier Execution Sandbox  ·  TypeSafe Jev Calibration  ·  12 Institutional Alpha Strategies  ·  Obsidian Neural Brain</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(76, 262)" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="196" height="36" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#10B981" stroke-opacity="0.42"/>
      <text x="16" y="23" fill="#34D399">🛡️ 五级渐进式安全沙盒</text>
    </g>
    <g transform="translate(210, 0)">
      <rect width="212" height="36" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.42"/>
      <text x="16" y="23" fill="#38BDF8">🧠 Jev × 多模型双核门禁</text>
    </g>
    <g transform="translate(436, 0)">
      <rect width="208" height="36" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#818CF8" stroke-opacity="0.42"/>
      <text x="16" y="23" fill="#A5B4FC">♟️ 12 套机构级策略矩阵</text>
    </g>
    <g transform="translate(658, 0)">
      <rect width="214" height="36" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#C084FC" stroke-opacity="0.42"/>
      <text x="16" y="23" fill="#D8B4FE">🧬 IS/OOS 防过拟合自进化</text>
    </g>
    <g transform="translate(886, 0)">
      <rect width="224" height="36" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#F59E0B" stroke-opacity="0.42"/>
      <text x="16" y="23" fill="#FBBF24">📓 Obsidian 双链复盘大脑</text>
    </g>
  </g>
</svg>
