name: 自动构建并部署至 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: 编译打包静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 pnpm 包管理器
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 配置 Node.js 环境与缓存
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装项目依赖
        run: pnpm install

      - name: 构建生产环境静态包
        run: pnpm build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物 (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: 发布至 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 执行线上部署
        id: deployment
        uses: actions/deploy-pages@v4
